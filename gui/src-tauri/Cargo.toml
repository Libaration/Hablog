[package]
name = "hablog-gui"
version = "0.1.0"
edition = "2021"
description = "Hablog's desktop window"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hablog = { path = "../.." }
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.40", features = ["sync", "time"] }
